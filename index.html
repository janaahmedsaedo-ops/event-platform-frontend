<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Convene — Event Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="nav">
    <div class="nav__brand">
      <span class="nav__mark">CE</span>
      <span>Convene</span>
    </div>
    <nav class="nav__links">
      <button class="nav__link" data-nav="dashboard">Dashboard</button>
      <button class="nav__link" data-nav="events">Events</button>
      <button class="nav__link" data-nav="create">New Event</button>
    </nav>
  </header>

  <main class="main">

    <section id="view-dashboard" class="view">
      <div class="view__head">
        <p class="eyebrow">Overview</p>
        <h1>Platform stats</h1>
      </div>
      <div id="dashboard-content" class="dashboard-grid" aria-live="polite"></div>
    </section>

    <section id="view-events" class="view view--hidden">
      <div class="view__head">
        <p class="eyebrow">Catalogue</p>
        <h1>All events</h1>
      </div>

      <form id="filters" class="filters">
        <input type="text" name="search" placeholder="Search by title…" autocomplete="off" />
        <input type="text" name="category" placeholder="Category" autocomplete="off" />
        <input type="text" name="location" placeholder="Location" autocomplete="off" />
        <input type="date" name="date" />
        <button type="submit" class="btn btn--primary">Apply</button>
        <button type="button" id="clear-filters" class="btn btn--ghost">Clear</button>
      </form>

      <div id="events-list" class="cards-grid" aria-live="polite"></div>
    </section>

    <section id="view-detail" class="view view--hidden">
      <button class="btn btn--ghost back-btn" data-nav="events">← Back to events</button>
      <div id="detail-content" aria-live="polite"></div>
    </section>

    <section id="view-create" class="view view--hidden">
      <div class="view__head">
        <p class="eyebrow" id="create-eyebrow">New</p>
        <h1 id="create-title">Create event</h1>
      </div>

      <form id="event-form" class="event-form" novalidate>
        <input type="hidden" name="id" />

        <label class="field">
          <span>Title</span>
          <input type="text" name="title" required />
          <small class="field__error" data-error-for="title"></small>
        </label>

        <label class="field">
          <span>Category</span>
          <input type="text" name="category" required />
          <small class="field__error" data-error-for="category"></small>
        </label>

        <label class="field">
          <span>Location</span>
          <input type="text" name="location" required />
          <small class="field__error" data-error-for="location"></small>
        </label>

        <label class="field">
          <span>Date &amp; time</span>
          <input type="datetime-local" name="date" required />
          <small class="field__error" data-error-for="date"></small>
        </label>

        <label class="field">
          <span>Capacity</span>
          <input type="number" name="capacity" min="1" required />
          <small class="field__error" data-error-for="capacity"></small>
        </label>

        <label class="field field--full">
          <span>Description</span>
          <textarea name="description" rows="4"></textarea>
          <small class="field__error" data-error-for="description"></small>
        </label>

        <div class="field--full form-actions">
          <button type="submit" class="btn btn--primary">Save event</button>
          <button type="button" class="btn btn--ghost" data-nav="events">Cancel</button>
        </div>
      </form>
    </section>

  </main>

  <div id="toast-container" class="toast-container"></div>

  <div id="confirm-modal" class="modal-overlay modal-overlay--hidden">
    <div class="modal">
      <p id="confirm-message">Are you sure?</p>
      <div class="modal__actions">
        <button id="confirm-cancel" class="btn btn--ghost">Cancel</button>
        <button id="confirm-ok" class="btn btn--danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/events.js"></script>
  <script src="js/views/detail.js"></script>
  <script src="js/views/create.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
